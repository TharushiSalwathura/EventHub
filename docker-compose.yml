version: '3.8'

services:
  # ==========================================
  # DATABASES & INFRASTRUCTURE
  # ==========================================

  # Member 1 Auth Database
  auth-db:
    image: postgres:16-alpine
    container_name: eventhub-auth-db
    environment:
      POSTGRES_DB: eventhub_auth
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventhub_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-net

  # Member 2 Event Database
  event-db:
    image: postgres:16-alpine
    container_name: eventhub-event-db
    environment:
      POSTGRES_DB: eventhub_event
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventhub_event"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-net

  # Member 3 Booking Database
  booking-db:
    image: postgres:16-alpine
    container_name: eventhub-booking-db
    environment:
      POSTGRES_DB: eventhub_booking
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventhub_booking"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-net

  # Member 4 Payment Database
  payment-db:
    image: postgres:16-alpine
    container_name: eventhub-payment-db
    environment:
      POSTGRES_DB: eventhub_payment
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventhub_payment"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-net

  # Redis for Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: eventhub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-net

  # ==========================================
  # MICROSERVICES & FRONTEND
  # ==========================================

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: eventhub-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/eventhub_auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SERVICE_KEY: ${AUTH_SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - eventhub-net

  event-service:
    build:
      context: ./event-service
      dockerfile: Dockerfile
    container_name: eventhub-event-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/eventhub_event
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EVENT_SERVICE_KEY: ${EVENT_SERVICE_KEY}
    depends_on:
      event-db:
        condition: service_healthy
    networks:
      - eventhub-net

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: eventhub-booking-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/eventhub_booking
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      BOOKING_SERVICE_KEY: ${BOOKING_SERVICE_KEY}
    depends_on:
      booking-db:
        condition: service_healthy
    networks:
      - eventhub-net

  payment-notification-service:
    build:
      context: ./payment-notification-service
      dockerfile: Dockerfile
    container_name: eventhub-payment-notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/eventhub_payment
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PAYMENT_NOTIFICATION_KEY: ${PAYMENT_NOTIFICATION_KEY}
      BOOKING_SERVICE_URL: http://booking-service:8083
      BOOKING_SERVICE_KEY: ${BOOKING_SERVICE_KEY}
    depends_on:
      payment-db:
        condition: service_healthy
    networks:
      - eventhub-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: eventhub-api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      EVENT_SERVICE_URL: http://event-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_SERVICE_URL: http://payment-notification-service:8084
      AUTH_SERVICE_KEY: ${AUTH_SERVICE_KEY}
      EVENT_SERVICE_KEY: ${EVENT_SERVICE_KEY}
      BOOKING_SERVICE_KEY: ${BOOKING_SERVICE_KEY}
      PAYMENT_NOTIFICATION_KEY: ${PAYMENT_NOTIFICATION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - auth-service
      - event-service
      - booking-service
      - payment-notification-service
      - redis
    networks:
      - eventhub-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventhub-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - eventhub-net

networks:
  eventhub-net:
    driver: bridge
