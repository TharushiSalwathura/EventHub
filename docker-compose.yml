services:
  # ==========================================
  # MONGO DATABASES & INFRASTRUCTURE
  # ==========================================

  # Member 1 Auth Database (MongoDB)
  auth-db:
    image: mongo:7.0
    container_name: eventhub-auth-db
    ports:
      - "27017:27017"
    networks:
      - eventhub-net

  # Member 2 Event Database (MongoDB)
  event-db:
    image: mongo:7.0
    container_name: eventhub-event-db
    ports:
      - "27018:27017"
    networks:
      - eventhub-net

  # Member 3 Booking Database (MongoDB)
  booking-db:
    image: mongo:7.0
    container_name: eventhub-booking-db
    ports:
      - "27019:27017"
    networks:
      - eventhub-net

  # Member 4 Payment Database (MongoDB)
  payment-db:
    image: mongo:7.0
    container_name: eventhub-payment-db
    ports:
      - "27020:27017"
    networks:
      - eventhub-net

  # Redis for Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: eventhub-redis
    ports:
      - "6379:6379"
    networks:
      - eventhub-net

  # ==========================================
  # MICROSERVICES & FRONTEND
  # ==========================================

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: eventhub-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://auth-db:27017/eventhub_auth
      AUTH_SERVICE_KEY: ${AUTH_SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-db
    networks:
      - eventhub-net

  event-service:
    build:
      context: ./event-service
      dockerfile: Dockerfile
    container_name: eventhub-event-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://event-db:27017/eventhub_event
      EVENT_SERVICE_KEY: ${EVENT_SERVICE_KEY}
    depends_on:
      - event-db
    networks:
      - eventhub-net

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: eventhub-booking-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://booking-db:27017/eventhub_booking
      BOOKING_SERVICE_KEY: ${BOOKING_SERVICE_KEY}
    depends_on:
      - booking-db
    networks:
      - eventhub-net

  payment-notification-service:
    build:
      context: ./payment-notification-service
      dockerfile: Dockerfile
    container_name: eventhub-payment-notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://payment-db:27017/eventhub_payment
      PAYMENT_NOTIFICATION_KEY: ${PAYMENT_NOTIFICATION_KEY}
      BOOKING_SERVICE_URL: http://booking-service:8083
      BOOKING_SERVICE_KEY: ${BOOKING_SERVICE_KEY}
    depends_on:
      - payment-db
    networks:
      - eventhub-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: eventhub-api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      EVENT_SERVICE_URL: http://event-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_SERVICE_URL: http://payment-notification-service:8084
      AUTH_SERVICE_KEY: ${AUTH_SERVICE_KEY}
      EVENT_SERVICE_KEY: ${EVENT_SERVICE_KEY}
      BOOKING_SERVICE_KEY: ${BOOKING_SERVICE_KEY}
      PAYMENT_NOTIFICATION_KEY: ${PAYMENT_NOTIFICATION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - auth-service
      - event-service
      - booking-service
      - payment-notification-service
      - redis
    networks:
      - eventhub-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventhub-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - eventhub-net

networks:
  eventhub-net:
    driver: bridge
