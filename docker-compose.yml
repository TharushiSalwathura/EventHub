version: '3.8'

services:
  # ==========================================
  # DATABASES & INFRASTRUCTURE
  # ==========================================

  # Member 1 Auth Database
  auth-db:
    image: postgres:16-alpine
    container_name: eventhub-auth-db
    environment:
      POSTGRES_DB: eventhub_auth
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventhub_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-net

  # Member 2 Event Database
  event-db:
    image: postgres:16-alpine
    container_name: eventhub-event-db
    environment:
      POSTGRES_DB: eventhub_event
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventhub_event"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-net

  # Member 3 Booking Database
  booking-db:
    image: postgres:16-alpine
    container_name: eventhub-booking-db
    environment:
      POSTGRES_DB: eventhub_booking
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventhub_booking"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-net

  # Member 4 Payment Database
  payment-db:
    image: postgres:16-alpine
    container_name: eventhub-payment-db
    environment:
      POSTGRES_DB: eventhub_payment
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventhub_payment"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-net

  # Redis for Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: eventhub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eventhub-net

  # ==========================================
  # MEMBER 1 MICROSERVICES
  # ==========================================

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: eventhub-auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/eventhub_auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SERVICE_KEY: ${AUTH_SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - eventhub-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: eventhub-api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      EVENT_SERVICE_URL: http://event-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_SERVICE_URL: http://payment-notification-service:8084
      AUTH_SERVICE_KEY: ${AUTH_SERVICE_KEY}
      EVENT_SERVICE_KEY: ${EVENT_SERVICE_KEY}
      BOOKING_SERVICE_KEY: ${BOOKING_SERVICE_KEY}
      PAYMENT_NOTIFICATION_KEY: ${PAYMENT_NOTIFICATION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - auth-service
      - redis
    networks:
      - eventhub-net

networks:
  eventhub-net:
    driver: bridge
