server:
  port: 8084

spring:
  application:
    name: payment-notification-service-test
  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

api:
  key: payment-service-secret-key-12345

services:
  booking:
    url: http://localhost:8083
    key: booking-service-secret-key-12345
